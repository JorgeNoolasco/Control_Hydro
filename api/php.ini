; Configuração do PHP carregada pelo runtime da Vercel.
; Oculta detalhes internos das falhas na resposta enviada ao navegador.
display_errors = Off
display_startup_errors = Off
; Mantém todos os níveis de erro disponíveis nos logs do servidor.
log_errors = On
error_reporting = E_ALL
; Evita anunciar a versão do PHP nos cabeçalhos da resposta.
expose_php = Off
; Fuso padrão para funções de data quando a aplicação não informar outro explicitamente.
date.timezone = America/Sao_Paulo
